name: host build
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - run: cmake -S . -B build -DCMAKE_C_FLAGS=-m32 -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j
      - run: ./build/nintendogs_memtest
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -A Win32
      - run: cmake --build build --config Release
      - run: .\build\Release\nintendogs_memtest.exe
  game-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - run: python3 port/tools/host_compile.py --out host_compile_report.txt --link build/objs || true
      - uses: actions/upload-artifact@v4
        with:
          name: host-compile-report
          path: host_compile_report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nintendogs-pc-linux
          path: build/objs/nintendogs_pc
          if-no-files-found: ignore
  game-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          install: mingw-w64-i686-gcc mingw-w64-i686-python
      - run: python port/tools/host_compile.py --cc gcc --out host_compile_report_win.txt --link build/objs --exe nintendogs_pc.exe || true
      - uses: actions/upload-artifact@v4
        with:
          name: host-compile-report-windows
          path: host_compile_report_win.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nintendogs-pc-windows
          path: build/objs/nintendogs_pc.exe
          if-no-files-found: ignore
