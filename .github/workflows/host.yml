name: host build
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - run: cmake -S . -B build -DCMAKE_C_FLAGS=-m32 -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j
      - run: ./build/nintendogs_pc
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -A Win32
      - run: cmake --build build --config Release
      - run: .\build\Release\nintendogs_pc.exe
  game-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - run: python3 port/tools/host_compile.py --out host_compile_report.txt --link build/objs || true
      - uses: actions/upload-artifact@v4
        with:
          name: host-compile-report
          path: host_compile_report.txt
